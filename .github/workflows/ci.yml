# Modified for Gust (https://github.com/appdoze/gust); see MODIFICATIONS.md.
# Builds the compiler and runs the whole suite -- parse, roundtrip, typecheck,
# error tests, Goose/native C at -O0 and -O2, targeted GS_DEBUG=1 tests, a
# second C-front-end probe, the in-process TinyCC backend, and samples -- on
# all three desktop platforms.
# One additional Linux profile instruments the compiler and generated C;
# sanitizer x platform x optimization x runtime mode is deliberately not a matrix.
# The runners bring the compilers
# the test script looks for: MSVC and its bundled clang on Windows, gcc and
# clang on Ubuntu, Apple clang on macOS.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to a branch or pull request makes the running job's answer
# stale, so it is cancelled there. On the default branch every commit runs to
# the end, so that each one has a complete result: cancelling there left
# commits with no answer from three of the four jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test:
    name: ${{ matrix.os }} / baseline
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing is a result about that platform, not a reason to
      # stop finding out about the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # The gfx and physics packages are fetched from their own repositories
      # by the configure below (GOOSE_BUILTIN_LIBS), submodules and all.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # SDL3, built for the gfx package, needs the headers of what it can
      # talk to (SDL's docs/README-linux.md, less OpenGL, which it is built
      # without); with no window system at all the package builds nothing.
      # Mesa's lavapipe is a Vulkan device with no GPU, for the gfx tests to
      # run on. SQLite's, libcurl's and OpenSSL's headers are for the test of
      # gust cimport on them (test/cimport_libs.py).
      - name: Install SDL build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libdbus-1-dev
          libibus-1.0-dev libudev-dev libthai-dev libpipewire-0.3-dev libwayland-dev
          libdecor-0-dev liburing-dev mesa-vulkan-drivers libvulkan1
          libsqlite3-dev libcurl4-openssl-dev libssl-dev

      # CMAKE_BUILD_TYPE is what the single-config generators read and --config
      # is what the Visual Studio generator reads; passing both builds Debug
      # (asserts on) everywhere.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DGOOSE_BUILTIN_LIBS=all

      - name: Build
        run: cmake --build build --config Debug

      # The samples and the standard library are kept as goose format
      # writes them. On Linux only: a Windows checkout may have \r\n line
      # breaks, which the formatter would report in every file.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: build/gust format --check samples stdlib

      - name: Test
        run: python test/run_tests.py --exe build/${{ runner.os == 'Windows' && 'Debug/gust.exe' || 'gust' }} --profile baseline --cc native --require-clang

      # Gust's --checked builds: the suite's GS_DEBUG=1 programs already run
      # optimized above; this builds every sample the same way, where a
      # check that fires on a correct program is a bug in the checks.
      - name: Samples, checked
        run: python samples/run_samples.py --exe build/${{ runner.os == 'Windows' && 'Debug/gust.exe' || 'gust' }} --checked --no-jit --cc native

      # Gust: the cross-language suite (compare/). Every Gust build of the
      # benchmarks and Rust's agree on every checksum, and every safety probe
      # does what compare/safety/expected.json says; `parallel for`'s nbody and
      # raytrace give their sequential checksums, as rayon's do. Timings from
      # CI mean nothing; compare/results.json and compare/parallel_results.json
      # are measured runs on one machine.
      - name: Compare (checksums and safety probes)
        env:
          GUST: build/${{ runner.os == 'Windows' && 'Debug/gust.exe' || 'gust' }}
        run: |
          python compare/run_bench.py --check
          python compare/run_parallel.py --check
          python compare/safety/run_safety.py --check

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The VS Code extension's tests: its grammar, its reading of the
      # compiler's diagnostics, and the language server over its own
      # protocol, against the compiler just built.
      - name: Test the VS Code extension
        working-directory: vscode
        env:
          GOOSE_TEST_COMPILER: ${{ github.workspace }}/build/${{ runner.os == 'Windows' && 'Debug/gust.exe' || 'gust' }}
        run: |
          npm ci --no-audit --no-fund
          npm test

  sanitize:
    name: Linux / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # No builtin packages: this is the build that takes the no-gfx and
      # no-physics paths, where those tests still typecheck and generate C.
      # The sanitizer profile does not
      # run the JIT, whose program is uninstrumented and outlives its own
      # allocations.

      # Instrument the C++ compiler as well as the C it emits. -O1 keeps
      # useful sanitizer stacks and compiler build time modest. Generated C
      # disables only alignment checks because Goose deliberately packs data;
      # the compiler itself retains the full undefined-behavior checks.
      - name: Configure instrumented compiler
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build instrumented compiler
        run: cmake --build build-sanitize --parallel 2

      - name: Test compiler, generated C, runtime lifecycle and samples
        run: python test/run_tests.py --exe build-sanitize/gust --profile sanitize --cc clang

  # Gust: TinyCC as a shared library beside the compiler (GUST_TCC_SHARED),
  # which a release ships for the LGPL's relinking: the compiler finds it
  # there, and an in-process run and gust cimport work through it.
  tcc-shared:
    name: ${{ matrix.os }} / TinyCC shared
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGUST_TCC_SHARED=ON

      - name: Build
        run: cmake --build build --config Release --target goose --parallel 4

      - name: Run through the shared TinyCC
        shell: bash
        run: |
          exe=$(pwd -W 2>/dev/null || pwd)/build/${{ runner.os == 'Windows' && 'Release/gust.exe' || 'gust' }}
          ls "$(dirname "$exe")" | grep gusttcc
          "$exe" run -q test/codegen/labeled_jumps.goose | diff --strip-trailing-cr - test/expected/labeled_jumps.out
          python -c "import sys; sys.path[:0] = ['test', 'scripts']; from cimport import check_cimport; check_cimport('$exe', 'cc', 'build/ci-cimport'); print('cimport ok')"
