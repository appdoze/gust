name: Probe

on:
  push:
    branches: ['probe/win-queue']

jobs:
  qfinal:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: The protocol, every interleaving
        if: matrix.os == 'ubuntu-latest'
        run: python .github/probe/qmodel3.py 6
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target goose -j 4
      - name: Build main's compiler
        run: |
          git worktree add "$RUNNER_TEMP/old" 0aead20d
          cd "$RUNNER_TEMP/old"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target goose -j 4
      - name: Measure
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python .github/probe/qfinal.py build/Release/gust.exe "$RUNNER_TEMP/old/build/Release/gust.exe" --out "$RUNNER_TEMP/qw"
          else
            python .github/probe/qfinal.py build/gust "$RUNNER_TEMP/old/build/gust" --out "$RUNNER_TEMP/qw"
          fi
