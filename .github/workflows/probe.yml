name: Probe
on:
  push:
    branches: ['probe/two-lock']
jobs:
  twolock:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --target goose -j 4
      - name: The one-lock queue to compare with
        run: |
          git worktree add /tmp/old 1966cf52
          cd /tmp/old
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target goose -j 4
      - run: python .github/probe/twolock.py
