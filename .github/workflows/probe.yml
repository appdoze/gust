name: Probe

on:
  push:
    branches: ['probe/win-queue']

jobs:
  qpoll:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target goose -j 4
      - name: Build the one-lock queue's compiler
        run: |
          git worktree add "$RUNNER_TEMP/old" 1966cf52
          cd "$RUNNER_TEMP/old"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target goose -j 4
      - name: Measure
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python .github/probe/qpoll.py build/Release/gust.exe --old "$RUNNER_TEMP/old/build/Release/gust.exe" --out "$RUNNER_TEMP/qw"
          else
            python .github/probe/qpoll.py build/gust --old "$RUNNER_TEMP/old/build/gust" --out "$RUNNER_TEMP/qw"
          fi
