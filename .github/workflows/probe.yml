name: Probe
on:
  push:
    branches: ['probe/adapt']
jobs:
  adapt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: sudo apt-get install -y --no-install-recommends time file
      - run: python -m pip install ziglang
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --target goose -j 4
      - run: python .github/probe/adapt.py
