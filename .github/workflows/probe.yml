name: Probe

on:
  push:
    branches: ['probe/win-queue']

jobs:
  sortp:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target goose -j 4
      - name: Valgrind
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y --no-install-recommends valgrind
      - name: Measure
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python .github/probe/sortprobe.py build/Release/gust.exe 11
          else
            python .github/probe/sortprobe.py build/gust 11
          fi
