name: Probe

on:
  push:
    branches: ['probe/win-queue']

jobs:
  qlock:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target goose -j 4
      - name: Measure
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python .github/probe/qlock.py build/Release/gust.exe --out "$RUNNER_TEMP/qw"
          else
            python .github/probe/qlock.py build/gust --out "$RUNNER_TEMP/qw"
          fi
