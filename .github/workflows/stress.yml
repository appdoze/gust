# Gust: a stress of net_serve.goose's starved worker on Windows, where its
# reply once arrived at full length with zeros in it (test/stress). Many
# copies at once, for the load the suite's runs had, with the whole
# net_serve.goose alongside. Runs on the stress/ branches only.
name: Stress

on:
  push:
    branches: ['stress/**']
  workflow_dispatch:

jobs:
  net:
    name: windows-latest / ${{ matrix.cc }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cc: [msvc, clang]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target goose

      - name: Build the programs
        run: |
          build/Release/gust.exe build -q -O2 --cc ${{ matrix.cc }} -o starved.exe test/stress/net_starved.goose
          build/Release/gust.exe build -q -O2 --cc ${{ matrix.cc }} -o net_serve.exe test/threads/net_serve.goose

      # Whether AVX registers survive a commit-on-fault handler that resumes
      # (test/stress/avx_commit_probe.c): three copies as the runtime's
      # handler is, three saving the AVX state around its VirtualAlloc.
      - name: AVX across the commit handler
        run: |
          "/c/Program Files/LLVM/bin/clang.exe" -O2 -o probe.exe test/stress/avx_commit_probe.c
          for m in 0 0 0 1 1 1; do ./probe.exe $m 60 & done
          wait
        continue-on-error: true

      # Six copies of the stress, 40 rounds each, and two loops of the whole
      # test, all at once; each failure's output is kept. Copies 4 to 6 and
      # the second loop poll with WSAPoll (GUST_NET_POLL=1) rather than AFD.
      - name: Stress
        run: |
          mkdir -p out
          for c in 1 2 3 4 5 6; do
            poll=$([ $c -gt 3 ] && echo 1 || echo 0)
            ( GUST_NET_POLL=$poll ./starved.exe 40 > out/starved-$c.txt 2>&1; echo "exit $? poll $poll" >> out/starved-$c.txt ) &
          done
          for c in 1 2; do
            (
              for i in $(seq 1 12); do
                GUST_NET_POLL=$((c - 1)) ./net_serve.exe > out/ns-$c-$i.txt 2>&1
                if diff -q <(tr -d '\r' < out/ns-$c-$i.txt) test/expected/net_serve.out > /dev/null; then
                  rm out/ns-$c-$i.txt
                else
                  echo "net_serve run $c-$i differs"
                fi
              done
            ) &
          done
          wait
          bad=0
          for f in out/starved-*.txt; do
            if ! grep -q '^exit 0' "$f"; then
              bad=1
              echo "== $f"
              grep -v 'intact true, on the wire true' "$f"
            fi
          done
          for f in out/ns-*.txt; do
            [ -e "$f" ] || continue
            bad=1
            echo "== $f"
            diff <(tr -d '\r' < "$f") test/expected/net_serve.out || true
          done
          echo "stress rounds run: $(cat out/starved-*.txt | grep -c '^round ')"
          exit $bad
